name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '24'
          cache: 'maven'

      # actions/setup-java's own server-id/server-username/server-password inputs only write
      # one <server> entry -- this repo now needs two (github, central), so the whole
      # settings.xml is written here instead. Values are env var references, same pattern as
      # the local ~/.m2/settings.xml -- never a literal secret in a file.
      - name: Write Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
              xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
              <servers>
                  <server>
                      <id>github</id>
                      <username>${env.GITHUB_ACTOR}</username>
                      <password>${env.GITHUB_TOKEN}</password>
                  </server>
                  <server>
                      <id>central</id>
                      <username>${env.CENTRAL_TOKEN_USERNAME}</username>
                      <password>${env.CENTRAL_TOKEN_PASSWORD}</password>
                  </server>
              </servers>
          </settings>
          EOF

      - name: Import GPG key
        run: echo "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      # The release tag (e.g. "v0.2.0") becomes the published version, stripped of its
      # leading "v" -- ephemeral, not committed back, so pom.xml keeps developing against
      # 0.1.0-SNAPSHOT between releases.
      - name: Set version from release tag
        run: ./mvnw --batch-mode versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DprocessAllModules=true -DgenerateBackupPoms=false

      # -Prelease also signs and publishes to Maven Central (task-connectrpc-spring-boot-starter
      # Phase 8), alongside the plain deploy's GitHub Packages push -- both stay live for one
      # release cycle after this lands, until every consumer has migrated off GitHub Packages.
      - name: Publish to GitHub Packages and Maven Central
        run: ./mvnw --batch-mode -Prelease deploy -DskipTests -Dgpg.passphrase="$GPG_PASSPHRASE"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
